services:
  # PostgreSQL Datenbank
  postgres:
    image: postgres:16-alpine
    container_name: duengungsberater-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-duengungsberater}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - duengungsberater-network

  # Mock Supabase Auth Server
  auth-server:
    build:
      context: .
      dockerfile: Dockerfile.auth
    container_name: duengungsberater-auth
    ports:
      - "3000:3000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-duengungsberater}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - duengungsberater-network

  # Vue.js App
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: duengungsberater-app
    ports:
      - "5173:5173"
    environment:
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-http://auth-server:3000}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - auth-server
    networks:
      - duengungsberater-network

volumes:
  postgres_data:

networks:
  duengungsberater-network:
    driver: bridge
