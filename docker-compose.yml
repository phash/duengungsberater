services:
  # ── PostgreSQL ──
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/init-db/00-setup.sh:/docker-entrypoint-initdb.d/00-setup.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Inbucket (E-Mail-Catcher) ──
  mail:
    image: inbucket/inbucket:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAIL_PORT:-9000}:9000"

  # ── GoTrue (Auth) ──
  auth:
    image: supabase/gotrue:v2.158.1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SITE_URL}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ""
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: ${MAILER_AUTOCONFIRM:-true}
      GOTRUE_SMTP_HOST: mail
      GOTRUE_SMTP_PORT: 2500
      GOTRUE_SMTP_ADMIN_EMAIL: noreply@duengungsberater.local
      GOTRUE_SMTP_SENDER_NAME: Düngungsberater
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /verify
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://app:80/mail-confirmation.html
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://app:80/mail-recovery.html
      GOTRUE_MAILER_TEMPLATES_EMAIL_CHANGE: http://app:80/mail-email-change.html
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: "Düngungsberater — E-Mail bestätigen"
      GOTRUE_MAILER_SUBJECTS_RECOVERY: "Düngungsberater — Passwort zurücksetzen"
      GOTRUE_MAILER_SUBJECTS_EMAIL_CHANGE: "Düngungsberater — E-Mail-Adresse ändern"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ── App migrations (one-shot, runs after GoTrue is healthy) ──
  migrate:
    image: postgres:16-alpine
    depends_on:
      auth:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./docker/migrate.sh:/migrate.sh:ro
      - ./supabase/migrations/001_initial_schema.sql:/sql/001_initial_schema.sql:ro
      - ./supabase/migrations/002_corrections_schema.sql:/sql/002_corrections_schema.sql:ro
      - ./supabase/migrations/003_nmin_fields.sql:/sql/003_nmin_fields.sql:ro
      - ./supabase/migrations/004_user_nutrient_demands_rls.sql:/sql/004_user_nutrient_demands_rls.sql:ro
      - ./supabase/migrations/005_field_geometries.sql:/sql/005_field_geometries.sql:ro
      - ./supabase/migrations/006_admin_user_management.sql:/sql/006_admin_user_management.sql:ro
      - ./supabase/seed.sql:/sql/seed.sql:ro
    entrypoint: ["sh", "/migrate.sh"]
    restart: "no"

  # ── PostgREST (REST API) ──
  rest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_DB_CHANNEL_ENABLED: "true"

  # ── PWA (nginx: static files + API reverse proxy) ──
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ""
        VITE_SUPABASE_ANON_KEY: ${ANON_KEY}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3080}:80"
    depends_on:
      rest:
        condition: service_started
      auth:
        condition: service_healthy

  # ── iBalis Proxy (OAuth2 + API Relay) ──
  ibalis-proxy:
    build:
      context: ./ibalis-proxy
    restart: unless-stopped
    environment:
      IBALIS_CLIENT_ID: ${IBALIS_CLIENT_ID:-}
      IBALIS_CLIENT_SECRET: ${IBALIS_CLIENT_SECRET:-}
      IBALIS_REDIRECT_URI: ${SITE_URL}/ibalis/callback
      IBALIS_MOCK: ${IBALIS_MOCK:-true}
      SITE_URL: ${SITE_URL}
      PORT: 3100

  # ── Cloudflare Quick Tunnel (optional, kein Account nötig) ──
  # Tunnel-URL: docker compose logs cloudflared
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --url http://app:80
    depends_on:
      - app
    restart: unless-stopped
    profiles:
      - tunnel

volumes:
  db-data:
