# Caddy Override — Produktion mit echtem Mailserver
# Start: docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d --build

services:
  app:
    container_name: duengungsberater-app
    ports:
      - "127.0.0.1:3090:80"
    networks:
      - default
      - caddy-proxy

  # Inbucket bleibt definiert (auth depends_on), aber ohne Port-Binding
  mail:
    ports: !reset []

  auth:
    environment:
      # Echten Mailserver statt Inbucket verwenden
      # Hostname muss dem TLS-Cert entsprechen (mail.mr-development.de, nicht "mailserver")
      GOTRUE_SMTP_HOST: mail.mr-development.de
      GOTRUE_SMTP_PORT: 587
      GOTRUE_SMTP_USER: ${SMTP_USER:-noreply@mr-development.de}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_USER:-noreply@mr-development.de}
      GOTRUE_SMTP_SENDER_NAME: "Düngungsberater"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
    extra_hosts:
      - "mail.mr-development.de:host-gateway"
    networks:
      - default
      - shared-services

networks:
  caddy-proxy:
    external: true
  shared-services:
    external: true
