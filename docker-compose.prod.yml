services:
  postgres:
    image: postgres:16-alpine
    container_name: duengungsberater-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-duengungsberater}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - duengungsberater-network
    restart: unless-stopped

  auth-server:
    build:
      context: .
      dockerfile: Dockerfile.auth
    container_name: duengungsberater-auth
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      DB_NAME: ${POSTGRES_DB:-duengungsberater}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - duengungsberater-network
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        VITE_SUPABASE_URL: https://duengungsberater.phash.de
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-placeholder}
    container_name: duengungsberater-app
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - auth-server
    networks:
      - duengungsberater-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  duengungsberater-network:
    driver: bridge
