# VPS nginx Konfiguration für duengungsberater.phash.de
# Voraussetzung: certbot --nginx -d duengungsberater.phash.de

server {
    listen 80;
    server_name duengungsberater.phash.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name duengungsberater.phash.de;

    ssl_certificate /etc/letsencrypt/live/duengungsberater.phash.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/duengungsberater.phash.de/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Auth-Server API
    location /auth/v1/ {
        proxy_pass http://127.0.0.1:3000/auth/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Supabase REST API
    location /rest/v1/ {
        proxy_pass http://127.0.0.1:3000/rest/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vue App (Static)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
