      <article>
        <h1>Düngebedarfsermittlung Bayern — kostenlos nach LfL-Basisdaten</h1>
        <p>Der Düngungsberater ist eine kostenlose Web-App für bayerische Landwirte zur Düngebedarfsermittlung. Er berechnet den Nährstoffbedarf für Stickstoff (N), Phosphat (P₂O₅), Kalium (K₂O), Magnesium (MgO) und Schwefel (S) auf Basis der offiziellen Richtwerte der Bayerischen Landesanstalt für Landwirtschaft (LfL).</p>

        <h2>Was ist eine Düngebedarfsermittlung?</h2>
        <p>Die Düngebedarfsermittlung (DBE) ist die rechnerische Ermittlung des tatsächlichen Stickstoff- und Phosphatbedarfs einer Kultur. Nach der Düngeverordnung (DüV) muss sie vor der ersten Düngung durchgeführt und dokumentiert werden. Sie berücksichtigt Kultur und Ertragsniveau, den Nmin-Vorrat des Bodens, Vorfrucht, Zwischenfrucht, organische Düngung und Humusgehalt. In Bayern stützt sich die Düngebedarfsermittlung auf die Basisdaten und Nmin-Richtwerte der LfL. Der Düngungsberater berechnet diesen Düngebedarf automatisch nach LfL-Basisdaten — als kostenlose Alternative zur Berechnung in iBalis.</p>

        <h2>Warum bedarfsgerechte Düngung?</h2>
        <p>Überdüngung belastet Grundwasser mit Nitrat, verursacht Lachgas-Emissionen und schadet der Bodengesundheit. Durch präzise Berechnung des tatsächlichen Bedarfs — anhand von Kultur, Ertragsziel, Vorfrucht und Nmin-Bodenprobe — lässt sich der Düngereinsatz oft deutlich reduzieren. Das schützt die Umwelt und spart Kosten. Jedes Kilogramm überflüssiger Stickstoff, das vermieden wird, spart rund 7 kg CO₂-Äquivalente.</p>

        <h2>Funktionen</h2>
        <ul>
          <li>Nährstoffbedarfs-Berechnung nach LfL-Basisdaten für über 50 Kulturen</li>
          <li>Korrekturfaktoren: Vorfrucht, Zwischenfrucht, Humusgehalt, Nmin-Bodenprobe</li>
          <li>iBalis-Import: Felddaten aus dem bayerischen Agrardatennetzwerk (GeoPackage, Shapefile)</li>
          <li>Feldkarte mit OpenStreetMap und Polygon-Darstellung</li>
          <li>Düngerprodukt-Empfehlungen mit exakter Mengenberechnung</li>
          <li>Offline-fähig als Progressive Web App (PWA)</li>
          <li>Kostenlos, werbefrei, datenschutzkonform (DSGVO), gehostet in Deutschland</li>
        </ul>

        <h2>Für wen?</h2>
        <p>Der Düngungsberater richtet sich an Landwirte, Agrarberatung und Pflanzenbau-Fachleute in Bayern. Die LfL-Basisdaten decken bayerische Kulturen und Standortbedingungen ab.</p>

        <h2>Motivation</h2>
        <p>Dieses Projekt entstand aus der Überzeugung, dass digitale Werkzeuge Landwirten helfen können, gezielter zu düngen — nicht mehr als nötig, nicht weniger als sinnvoll. Weniger überflüssiger Dünger bedeutet weniger Nitrat im Grundwasser, weniger klimaschädliche Emissionen und gesündere Böden für kommende Generationen.</p>

        <h2>Nmin-Richtwerte 2026 nach Regierungsbezirk</h2>
        <p>Endgültige Nmin-Werte der LfL Bayern (BLW 15/2026) für die Düngesaison 2026, aufgeschlüsselt nach Regierungsbezirk. Winterweizen (0-90 cm): Oberbayern 54, Niederbayern 56, Oberpfalz 62, Oberfranken 56, Mittelfranken 51, Unterfranken 57, Schwaben 48 kg N/ha. Silomais/Körnermais (0-90 cm): Oberbayern 68, Niederbayern 77, Oberpfalz 66, Oberfranken 67, Mittelfranken 62, Unterfranken 63, Schwaben 58 kg N/ha.</p>
